services:
  postgres:
    image: postgres:17
    container_name: ai-meeting-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: meeting_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meeting_api
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meeting_worker
    command: uv run celery -A app.worker.celery_app.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data: